# Watchdog thresholds — TUNABLE IN ONE PLACE
# Router
ROUTER_HOST=192.168.2.1
ROUTER_USER=root
SSH_TIMEOUT=15
OVERLAY_PCT_MAX=90
LOADAVG_MAX=3.0
CONNTRACK_MAX=5000
# Reachability
GW_LAN=192.168.2.1
GW_WAN=8.8.8.8
# GW_A2 removed: A2 AP is a different segment, unreachable from the HP.
PING_TIMEOUT=5
# Bind pings to this interface: the WiFi profile carries a bad route that
# sends 192.168.2.1 out of wlo1 (see router-access.sh).
PING_IFACE=enp2s0
PING_COUNT=3
# Agent watchdog
SESSION_DIR=/home/ricardo/.gentle-shell/agent/sessions
COMPACTION_WINDOW_MIN=30
COMPACTION_COUNT_MAX=5
STALL_MINUTES=25
# Alerting / rate limit
LOG=/home/ricardo/.local/share/gentle-watchdog/watchdog.log
STATE=/home/ricardo/.local/share/gentle-watchdog/alert-state
RATE_LIMIT_SEC=3600
# Longest run of IDENTICAL (tool+args) calls before calling it a loop.
# Calibrated 2026-11-19: normal sessions peak at 6-9; the GPU-burning IMGsMNG
# loop was far above. 12 avoids flagging honest repetitive work.
IDENTICAL_RUN_MAX=12
